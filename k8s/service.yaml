apiVersion: v1
kind: Service
metadata:
  name: k8s-playground
  labels:
    app: k8s-playground
spec:
  # LoadBalancer needs a cloud provider or `minikube tunnel`.
  # For kind, use type: NodePort and reach the node IP instead.
  type: LoadBalancer
  selector:
    app: k8s-playground
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
