apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-playground
  labels:
    app: k8s-playground
spec:
  replicas: 3
  selector:
    matchLabels:
      app: k8s-playground
  template:
    metadata:
      labels:
        app: k8s-playground
    spec:
      containers:
        - name: app
          image: k8s-playground:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
